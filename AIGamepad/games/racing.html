<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Vượt Chướng Ngại Vật</title>
    <style>
        body { margin: 0; overflow: hidden; background: #22c55e; color: white; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #334155; }
        #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; text-align: center; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.9); padding: 40px; border-radius: 20px; text-align: center; border: 4px solid #f87171; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-restart { background: #f87171; color: white; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 0 #b91c1c; }
        .btn-restart:active { transform: translateY(5px); box-shadow: none; }
        .flash { animation: flashRed 0.5s ease; }
        @keyframes flashRed { 0% { background: #ef4444; } 100% { background: #22c55e; } }
    </style>
</head>
<body>
    <div id="ui">
        ĐIỂM: <span id="score">0</span> <br>
        <span style="font-size: 16px; color: #fbbf24;">Tốc độ: <span id="speedDisplay">1.0</span>x</span> <br>
        <span style="font-size: 20px; color: #38bdf8;">⏱️ <span id="timerDisplay">02:00</span></span>
    </div>
    <div id="gameOver">
        <h1 style="color: #f87171; margin-top:0;">🏁 HẾT GIỜ!</h1>
        <p style="font-size: 20px;">Tổng điểm của bé: <span id="finalScore" style="color: #fbbf24; font-size: 24px; font-weight: bold;">0</span></p>
        <button class="btn-restart" onclick="restart()">🔄 CHƠI LẠI (Nhấn SPACE)</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400;
        canvas.height = window.innerHeight;

        let car = { x: 175, y: canvas.height - 250, width: 60, height: 100, speed: 4.5 };
        let obstacles = [];
        let score = 0;
        let gameActive = true;
        let speedMult = 1.0;
        let timeLeft = 120; // 2 minutes
        let invulnerable = 0; // ms remaining
        let lastTime = Date.now();

        let keys = { a: false, d: false, w: false, s: false, arrowleft: false, arrowright: false, arrowup: false, arrowdown: false };

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if ((k === ' ' || k === 'space') && !gameActive) restart();
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        
        // Listen for postMessage from parent iframe
        window.addEventListener('message', (e) => {
            if (e.data) {
                if (e.data.type === 'keyboard') {
                    const k = e.data.key.toLowerCase();
                    if (e.data.action === 'keydown') {
                        keys[k] = true;
                        if ((k === ' ' || k === 'space') && !gameActive) restart();
                    } else if (e.data.action === 'keyup') {
                        keys[k] = false;
                    }
                } else if (e.data.type === 'setSpeed') {
                    speedMult = e.data.speed;
                    document.getElementById('speedDisplay').innerText = speedMult.toFixed(1);
                }
            }
        });
        
        // Touch support
        window.addEventListener('touchstart', handleTouch);
        window.addEventListener('mousedown', handleTouch);
        function handleTouch(e) {
            if(!gameActive) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            if (x < window.innerWidth / 2) { keys.a = true; keys.d = false; }
            else { keys.d = true; keys.a = false; }
        }
        window.addEventListener('touchend', () => { keys.a = false; keys.d = false; });
        window.addEventListener('mouseup', () => { keys.a = false; keys.d = false; });

        function spawnObstacle() {
            if (!gameActive) return;
            
            const r = Math.random();
            let type = 'vehicle'; // default
            if (r > 0.8) type = 'item';
            else if (r > 0.6) type = 'obstacle';

            const width = (type === 'vehicle') ? 60 : 50;
            const height = (type === 'vehicle') ? 100 : 50;
            const x = 50 + Math.random() * (canvas.width - width - 100);
            
            let emoji = '';
            if (type === 'vehicle') emoji = ['🚓', '🚕', '🚙', '🚚'][Math.floor(Math.random()*4)];
            else if (type === 'item') emoji = ['⭐', '🍎', '🍌', '🍉', '🍓'][Math.floor(Math.random()*5)];
            else emoji = ['🚧', '🪨', '🪵'][Math.floor(Math.random()*3)];
            
            obstacles.push({ x: x, y: -100, width: width, height: height, emoji: emoji, type: type, passed: false });
            
            setTimeout(spawnObstacle, 800 + Math.random() * 1000 / Math.max(speedMult, 0.5));
        }

        function drawEmoji(emoji, x, y, size, alpha=1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = size + "px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(emoji, x + size/2, y + size/2);
            ctx.restore();
        }
        
        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function loop() {
            if (!gameActive) return;
            
            const now = Date.now();
            const dt = now - lastTime;
            lastTime = now;
            
            // Timer logic
            timeLeft -= dt / 1000;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOver();
            }
            document.getElementById('timerDisplay').innerText = formatTime(timeLeft);
            
            if (invulnerable > 0) {
                invulnerable -= dt;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Road
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grass borders
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, 0, 40, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);

            // Road markings
            ctx.fillStyle = '#f8fafc';
            for(let i=0; i<canvas.height; i+=60) {
                ctx.fillRect(canvas.width/2 - 5, (i + Date.now()*0.5*speedMult) % canvas.height, 10, 30);
                ctx.fillRect(45, (i + Date.now()*0.5*speedMult) % canvas.height, 5, 40);
                ctx.fillRect(canvas.width - 50, (i + Date.now()*0.5*speedMult) % canvas.height, 5, 40);
            }

            // Scenery
            for(let i=0; i<canvas.height; i+=150) {
                drawEmoji('🌲', 5, (i + Date.now()*0.5*speedMult) % canvas.height, 30);
                drawEmoji('🌲', canvas.width - 35, (i + Date.now()*0.5*speedMult) % canvas.height, 30);
            }

            // Speed Control
            let oldSpeed = speedMult;
            if (keys.w || keys.arrowup) speedMult += 0.05;
            if (keys.s || keys.arrowdown) speedMult -= 0.05;
            if (speedMult < 0.5) speedMult = 0.5;
            if (speedMult > 4.0) speedMult = 4.0;
            
            if (oldSpeed !== speedMult) {
                document.getElementById('speedDisplay').innerText = speedMult.toFixed(1);
                window.parent.postMessage({ type: 'speedUpdated', speed: speedMult }, '*');
            }

            // Move car
            if (keys.a || keys.arrowleft) car.x -= car.speed;
            if (keys.d || keys.arrowright) car.x += car.speed;
            if (car.x < 40) car.x = 40;
            if (car.x > canvas.width - 40 - car.width) car.x = canvas.width - 40 - car.width;

            // Draw Player Car (Blinking if invulnerable)
            const alpha = (invulnerable > 0 && Math.floor(now / 100) % 2 === 0) ? 0.3 : 1;
            drawEmoji('🏎️', car.x - 5, car.y - 10, 70, alpha);

            // Obstacles & Items
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += 5 * speedMult;
                
                drawEmoji(obs.emoji, obs.x, obs.y, obs.width);

                // Collision Detection
                const padding = 10;
                if (car.x + padding < obs.x + obs.width - padding && 
                    car.x + car.width - padding > obs.x + padding &&
                    car.y + padding < obs.y + obs.height - padding && 
                    car.y + car.height - padding > obs.y + padding) {
                    
                    if (obs.type === 'item') {
                        score += 15;
                        obstacles.splice(i, 1);
                        document.getElementById('score').innerText = score;
                        continue;
                    } else if (invulnerable <= 0) {
                        // Crash into vehicle or obstacle
                        document.body.classList.add('flash');
                        setTimeout(() => document.body.classList.remove('flash'), 500);
                        score = Math.max(0, score - (obs.type === 'vehicle' ? 10 : 5));
                        speedMult = 0.5; // slow down on crash
                        invulnerable = 2000; // 2 seconds iframes
                        document.getElementById('score').innerText = score;
                    }
                }

                // Scoring for passing vehicles safely
                if (obs.y > car.y + car.height && !obs.passed && obs.type === 'vehicle') {
                    obs.passed = true;
                    score += 5;
                    document.getElementById('score').innerText = score;
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
        }

        window.restart = function() {
            if (gameActive) return;
            car.x = 175;
            obstacles = [];
            score = 0;
            speedMult = 1.0;
            timeLeft = 120;
            invulnerable = 0;
            keys = { a: false, d: false, w: false, s: false, arrowleft: false, arrowright: false, arrowup: false, arrowdown: false };
            gameActive = true;
            lastTime = Date.now();
            document.getElementById('score').innerText = score;
            document.getElementById('gameOver').style.display = 'none';
            loop();
            spawnObstacle();
        }

        lastTime = Date.now();
        loop();
        spawnObstacle();
    </script>
</body>
</html>
