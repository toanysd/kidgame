<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Vượt Chướng Ngại Vật</title>
    <style>
        body { margin: 0; overflow: hidden; background: #22c55e; color: white; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #334155; }
        #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; text-align: center; border: 4px solid #f87171; }
    </style>
</head>
<body>
    <div id="ui">ĐIỂM: <span id="score">0</span></div>
    <div id="gameOver">
        <h1 style="color: #f87171;">RẦM! ĐỤNG RỒI!</h1>
        <p>Điểm của bé: <span id="finalScore">0</span></p>
        <p>Bấm <strong>SPACE (Nhảy)</strong> để chơi lại</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400;
        canvas.height = window.innerHeight;

        let car = { x: 175, y: canvas.height - 100, width: 50, height: 80, speed: 6 };
        let obstacles = [];
        let score = 0;
        let gameActive = true;
        let speedMult = 1;

        let keys = { a: false, d: false, arrowleft: false, arrowright: false };

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (k === ' ' && !gameActive) restart();
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function spawnObstacle() {
            if (!gameActive) return;
            const width = 50 + Math.random() * 50;
            const x = Math.random() * (canvas.width - width);
            obstacles.push({ x: x, y: -100, width: width, height: 50, color: ['#ef4444', '#eab308', '#3b82f6'][Math.floor(Math.random()*3)] });
            setTimeout(spawnObstacle, 1000 + Math.random() * 1000 / speedMult);
        }

        function drawCar(x, y) {
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(x, y, 50, 80);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(x+5, y+15, 40, 20); // windshield
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x-5, y+10, 10, 20); // wheels
            ctx.fillRect(x+45, y+10, 10, 20);
            ctx.fillRect(x-5, y+50, 10, 20);
            ctx.fillRect(x+45, y+50, 10, 20);
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Road markings
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for(let i=0; i<canvas.height; i+=40) {
                ctx.fillRect(canvas.width/2 - 5, (i + Date.now()*0.5*speedMult) % canvas.height, 10, 20);
            }

            // Move car
            if (keys.a || keys.arrowleft) car.x -= car.speed;
            if (keys.d || keys.arrowright) car.x += car.speed;
            
            // Bounds
            if (car.x < 0) car.x = 0;
            if (car.x > canvas.width - car.width) car.x = canvas.width - car.width;

            drawCar(car.x, car.y);

            // Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += 5 * speedMult;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision
                if (car.x < obs.x + obs.width && car.x + car.width > obs.x &&
                    car.y < obs.y + obs.height && car.y + car.height > obs.y) {
                    gameOver();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    speedMult += 0.02;
                    document.getElementById('score').innerText = score;
                }
            }

            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
        }

        function restart() {
            car.x = 175;
            obstacles = [];
            score = 0;
            speedMult = 1;
            gameActive = true;
            document.getElementById('score').innerText = score;
            document.getElementById('gameOver').style.display = 'none';
            loop();
            spawnObstacle();
        }

        loop();
        spawnObstacle();
    </script>
</body>
</html>
