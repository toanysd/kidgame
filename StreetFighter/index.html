<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="icon" href="./public/images/vsLogo.png" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<title>Street Fighter AR - KidGame Multi-Person & Online 1v1</title>
		<link rel="stylesheet" href="src/style.css?v=1781388288899" />
		
		<!-- PeerJS for WebRTC Online Multiplayer -->
		<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

		<!-- TensorFlow.js & MoveNet MultiPose for Multi-Person AR Tracking -->
		<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

		<!-- MediaPipe Pose (Fallback) -->
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
		
		<script src="bundle.js?v=1781388288899"></script>
	</head>

	<body>
		<div id="game-ui-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: flex; justify-content: center; align-items: center;">
			<a id="backBtn" href="../index.html" style="position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: rgba(0, 0, 0, 0.6); color: white; border: 1.5px solid #00e5ff; border-radius: 8px; text-decoration: none; font-weight: bold; font-family: sans-serif; pointer-events: auto; backdrop-filter: blur(6px); z-index: 110; transition: all 0.2s;">← Trở về Hub</a>
			
			<!-- Mode Selection in Start Scene -->
			<div id="modeSelection" style="position: absolute; bottom: 8%; pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; z-index: 110; display: none;">
				<button id="btn1P" style="padding: 12px 24px; font-size: 16px; background: linear-gradient(135deg, #0284c7, #06b6d4); color: white; border: 2px solid #38bdf8; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(6,182,212,0.4); text-transform: uppercase;">🤖 1 PLAYER (vs CPU)</button>
				<button id="btn2PLocal" style="padding: 12px 24px; font-size: 16px; background: linear-gradient(135deg, #c026d3, #ec4899); color: white; border: 2px solid #f472b6; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(236,72,153,0.4); text-transform: uppercase;">👥 2 PLAYERS (1 Camera)</button>
				<button id="btn2POnline" style="padding: 12px 24px; font-size: 16px; background: linear-gradient(135deg, #e11d48, #f97316); color: white; border: 2px solid #fb923c; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(249,115,22,0.4); text-transform: uppercase;">🌐 ONLINE 1v1 (2 Máy)</button>
			</div>

			<!-- Online Lobby Modal -->
			<div id="onlineModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); pointer-events: auto; z-index: 200; justify-content: center; align-items: center;">
				<div style="background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 2px solid #818cf8; border-radius: 20px; padding: 25px 30px; width: 90%; max-width: 500px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; font-family: sans-serif; position: relative;">
					<button id="closeOnlineModal" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; font-weight: bold;">✕</button>
					
					<h2 style="color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px;">🌐 ĐỐI CHIẾN ONLINE 1V1</h2>
					<p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Mỗi người chơi sử dụng 1 máy tính/camera độc lập</p>
					
					<!-- Create Room Section -->
					<div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px;">
						<h3 style="font-size: 15px; color: #a5b4fc; margin-bottom: 10px;">🌟 Bạn là Chủ Phòng (Máy 1 - RYU)</h3>
						<button id="btnCreateRoom" style="width: 100%; padding: 12px; background: #4f46e5; color: white; border: 1px solid #818cf8; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: background 0.2s;">TẠO PHÒNG MỚI</button>
						<div id="roomCreatedInfo" style="display: none; margin-top: 12px;">
							<p style="font-size: 12px; color: #cbd5e1;">Mã phòng của bạn:</p>
							<div style="display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 6px;">
								<span id="createdRoomCode" style="font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #38bdf8; background: #0f172a; padding: 4px 16px; border-radius: 6px; border: 1px dashed #38bdf8;">0000</span>
								<button id="btnCopyRoomLink" style="padding: 8px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">📋 Copy Link</button>
							</div>
							<p id="hostWaitText" style="font-size: 12px; color: #fbbf24; margin-top: 8px; animation: pulse 1.5s infinite;">⏳ Đang chờ người chơi thứ 2 tham gia...</p>
						</div>
					</div>

					<!-- Join Room Section -->
					<div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px;">
						<h3 style="font-size: 15px; color: #f472b6; margin-bottom: 10px;">⚔️ Bạn là Khách (Máy 2 - KEN)</h3>
						<div style="display: flex; gap: 8px;">
							<input id="inputRoomCode" type="text" placeholder="Nhập mã 4 số (vd: 1234)" style="flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #db2777; background: #0f172a; color: white; font-size: 14px; text-transform: uppercase; font-weight: bold; text-align: center;" />
							<button id="btnJoinRoom" style="padding: 10px 18px; background: #db2777; color: white; border: 1px solid #f472b6; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">VÀO TRẬN</button>
						</div>
					</div>

					<!-- Status text -->
					<div id="onlineStatusMessage" style="margin-top: 15px; font-size: 13px; color: #38bdf8; min-height: 20px;"></div>
				</div>
			</div>
		</div>

		<main>
			<canvas width="382px" height="224px"></canvas>
		</main>

		<audio
			id="kensTheme"
			src="./public/sounds/kens-theme.ogg"
			preload="auto"
			loop
		></audio>
		<audio
			id="sound-fighter-land"
			src="./public/sounds/land.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-kick-hit"
			src="./public/sounds/light-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-kick-hit"
			src="./public/sounds/medium-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-kick-hit"
			src="./public/sounds/heavy-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-attack"
			src="./public/sounds/light-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-attack"
			src="./public/sounds/medium-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-attack"
			src="./public/sounds/heavy-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-punch-hit"
			src="./public/sounds/light-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-punch-hit"
			src="./public/sounds/medium-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-punch-hit"
			src="./public/sounds/heavy-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ken-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ryu-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>

		<img id="KenStage" src="public/images/kenstage.png" alt="kenstage" />
		<img id="hud" src="public/images/hud.png" alt="HUD" />
		<img id="KenImage" src="./public/images/Ken.png" />
		<img id="RyuImage" src="public/images/Ryu.png" />
		<img id="ShadowImage" src="./public/images/shadow.png" />
		<img id="Decals" src="./public/images/decals.png" />
		<img id="Controls" src="./public/images/Controls.png" />
		<img id="Logo" src="./public/images/logo.png" />
		<img id="Winner" src="./public/images/winnerText.png" />
	</body>
</html>
