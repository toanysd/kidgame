<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="icon" href="./public/images/vsLogo.png" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Street Fighter by Mayank Jain</title>
		<link rel="stylesheet" href="src/style.css" />
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
		<script src="bundle.js"></script>
	</head>

	<body>
        <div id="game-ui-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: flex; justify-content: center;">
            <a id="backBtn" href="../index.html" style="position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid white; border-radius: 8px; text-decoration: none; font-weight: bold; font-family: sans-serif; pointer-events: auto; backdrop-filter: blur(4px);">← Trở về Hub</a>
            
            <div id="modeSelection" style="position: absolute; bottom: 15%; pointer-events: auto; display: flex; gap: 20px; display: none;">
                <button id="btn1P" style="padding: 15px 30px; font-size: 18px; background: #06b6d4; color: white; border: 2px solid white; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">1 PLAYER (vs CPU)</button>
                <button id="btn2P" style="padding: 15px 30px; font-size: 18px; background: #d946ef; color: white; border: 2px solid white; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">2 PLAYERS (vs Friend)</button>
            </div>
        </div>
		<main>
			<canvas width="382px" height="224px"></canvas>
		</main>
		<audio
			id="kensTheme"
			src="./public/sounds/kens-theme.ogg"
			preload="auto"
			loop
		></audio>
		<audio
			id="sound-fighter-land"
			src="./public/sounds/land.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-kick-hit"
			src="./public/sounds/light-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-kick-hit"
			src="./public/sounds/medium-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-kick-hit"
			src="./public/sounds/heavy-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-attack"
			src="./public/sounds/light-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-attack"
			src="./public/sounds/medium-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-attack"
			src="./public/sounds/heavy-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-punch-hit"
			src="./public/sounds/light-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-punch-hit"
			src="./public/sounds/medium-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-punch-hit"
			src="./public/sounds/heavy-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ken-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ryu-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>

		<img id="KenStage" src="public/images/kenstage.png" alt="kenstage" />
		<img id="hud" src="public/images/hud.png" alt="HUD" />
		<img id="KenImage" src="./public/images/Ken.png" />
		<img id="RyuImage" src="public/images/Ryu.png" />
		<img id="ShadowImage" src="./public/images/shadow.png" />
		<img id="Decals" src="./public/images/decals.png" />
		<img id="Controls" src="./public/images/Controls.png" />
		<img id="Logo" src="./public/images/logo.png" />
		<img id="Winner" src="./public/images/winnerText.png" />
	</body>
</html>
