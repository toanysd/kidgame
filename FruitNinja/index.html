<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja AR</title>
    <!-- Mediapipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #111; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        #gameCanvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #333;
            border-radius: 8px;
            /* Scale to fit screen while maintaining 16:9 ratio */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #score { color: #facc15; }
        #time { color: #3b82f6; margin-top: 5px; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px #3b82f6;
            pointer-events: none;
            display: none;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(0,0,0,0.7);
        }
        #startBtn {
            padding: 20px 40px;
            font-size: 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            font-family: 'Outfit', sans-serif;
            font-weight: bold;
            margin-bottom: 30px;
            transition: transform 0.2s;
        }
        #startBtn:hover {
            transform: scale(1.05);
        }
        .upload-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #3b82f6;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #2563eb;
        }
        #uploadStatus {
            margin-top: 15px;
            font-size: 18px;
            color: #facc15;
            font-weight: bold;
        }
        #backBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: background 0.3s;
            z-index: 20;
        }
        #backBtn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <a id="backBtn" href="../index.html">← Trở về Hub</a>
    <div id="ui" style="display: none;">
        <div id="score">Điểm: 0</div>
        <div id="time">Thời gian: 03:00</div>
    </div>
    
    <div id="startScreen">
        <button id="startBtn">BẮT ĐẦU CHƠI</button>
        <div>
            <label for="imageUpload" class="upload-btn">📁 Chọn Folder Ảnh & Âm Thanh</label>
            <input type="file" id="imageUpload" webkitdirectory directory multiple style="display: none;">
        </div>
        <div id="uploadStatus">Mẹo: Bỏ chung ảnh (.png) và âm thanh (.mp3) cùng tên vào chung thư mục!</div>
    </div>

    <div id="loading">Đang tải Camera & AI... Hãy lùi lại 1 mét!</div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="library.js"></script>
    <script src="app.js"></script>
</body>
</html>
